
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="icon" type="image/png" href="./img/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pombocia - Endereço</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- TELA DE CARREGAMENTO POMBOCIA -->
<div id="tela-carregamento">

    <img
        src="./img/logo.png"
        alt="Pombocia"
        class="logo-loading"
    >

    <h2>Preparando seu voo...</h2>

    <div class="barra-loading">
        <div class="progresso-loading"></div>
    </div>

    <p>Bem-vindo à Pombocia!</p>

</div>

<main class="celular">

    <section class="pagina pagina-endereco">

        <!-- CABEÇALHO -->
        <header class="cabecalho-endereco">

            <img src="./img/logo.png"
                 alt="Logo Pombocia"
                 class="logo-endereco">

            <a href="index.html" class="voltar-endereco">
                voltar
            </a>

        </header>

        <!-- TÍTULO -->
        <h1 class="titulo-endereco">
            Nosso Endereço
        </h1>

        <!-- IMAGEM DO ENDEREÇO -->
        
<<img src="img\endereço.png"
     alt="Localização"
     class="foto-endereco">

        <!-- HORÁRIO -->
        <div class="informacao-endereco">

            <h2>Horário de funcionamento </h2>

            <p>Segunda a sexta: 9h às 18h</p>
            <p>Sábado: 9h às 14h</p>
            <p>Domingo: Fechado</p>

        </div>

        <!-- ESTACIONAMENTO -->
        <div class="informacao-endereco">

            <h2>Estacionamento</h2>

            <p>
                Estacionamento gratuito até as 16:00!
            </p>

        </div>

    </section>

</main>
<script src="transicao.js"></script>
<script src="loading.js"></script>
</body>
</html>
