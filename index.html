</div>

    <main class="celular">
        <section class="pagina ativa" id="inicio">

            <img src="./img/logo.png"
                 alt="Pombocia"
                 class="logo">

           <div class="botoes">
    <a href="novidades.html">
        <img src="./img/Botão_Neon_NOVIDADES_com_Megafone-removebg-preview.png" class="botao-img">

<img src="./img/Pombo_fofo_com_asas_abertas_e_corações-removebg-preview.png"

class="pombo-flutuante"
alt="Mascote Pombocia">

<div id="fala-pombo" class="fala-pombo">
  Oiii! Bem-vindo à Pombocia! 💗
</div>

        </section>|
    </main>
<script src="transicao.js"></script>
<script src="loading.js"></script>




<script>
const pombo = document.querySelector(".pombo-flutuante");
const balao = document.getElementById("fala-pombo");

const frases = [
  "Oiii! Bem-vindo à Pombocia! 💗",
  "Você já viu nossas curiosidades? 🐦",
  "Sabia que a tecnologia está em tudo?",
  "Eu sou o mascote mais fofo daqui! 💕",
  "Continue explorando nosso site! ✨",
  "Pru pru! Eu adoro visitantes! 🐦"
];

let numeroFrase = 0;

if (pombo && balao) {
  pombo.addEventListener("click", function() {
    balao.style.display = "block";
    balao.textContent = frases[numeroFrase];

clearTimeout(window.tempoPombo);

window.tempoPombo = setTimeout(function() {
  balao.style.display = "none";
}, 10000);

    numeroFrase = (numeroFrase + 1) % frases.length;
  });
}
</script>
